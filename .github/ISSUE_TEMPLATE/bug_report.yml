name: Bug report
description: Report behavior that is not working as expected
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or client
      description: For example, Chrome 140 or the Glosify extension.
  - type: textarea
    id: details
    attributes:
      label: Extra details
      description: Add screenshots or safe log messages if they help. Do not include secrets or personal data.
