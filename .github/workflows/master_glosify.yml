name: Build, migrate, and deploy Glosify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Glosify_CI_Only_1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Glosify_CI_Only_1!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=glosify-ci;User Id=sa;Password=Glosify_CI_Only_1!;Encrypt=True;TrustServerCertificate=True
      RUN_SQLSERVER_TESTS: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            Glosify.ClientTests/package-lock.json
            Glosify.LiveSubtitles.Extension/package-lock.json

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Glosify.slnx

      - name: Audit NuGet packages
        run: >-
          dotnet restore Glosify.slnx
          --force-evaluate
          -p:WarningsNotAsErrors=

      - name: Build
        run: dotnet build Glosify.slnx --configuration Release --no-restore

      - name: Verify database migrations from empty SQL Server
        run: |
          dotnet ef database update 20260827093000_PrepareClassroomRetirement --project Glosify/Glosify.csproj --configuration Release --no-build
          dotnet ef database update --project Glosify/Glosify.csproj --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project Glosify/Glosify.csproj --configuration Release --no-build

      - name: Test
        run: >-
          dotnet test Glosify.Tests/Glosify.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=glosify-tests.trx"
          --results-directory "${{ runner.temp }}/test-results/dotnet"

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix Glosify.ClientTests
          npm ci --prefix Glosify.LiveSubtitles.Extension

      - name: Test browser extension JavaScript
        run: npm test --prefix Glosify.LiveSubtitles.Extension

      - name: Lint JavaScript
        run: npm run lint --prefix Glosify.LiveSubtitles.Extension

      - name: Audit extension dependencies
        run: npm audit --prefix Glosify.LiveSubtitles.Extension

      - name: Install extension Playwright Chromium
        working-directory: Glosify.LiveSubtitles.Extension
        run: npx playwright install --with-deps chromium

      - name: Install extension native-input dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes pulseaudio xdotool

      - name: Test MV3 extension in persistent Chromium
        working-directory: Glosify.LiveSubtitles.Extension
        run: |
          pulseaudio --start --exit-idle-time=-1
          trap 'pulseaudio --kill || true' EXIT
          pactl load-module module-null-sink sink_name=glosify_test
          pactl set-default-sink glosify_test
          pactl set-default-source glosify_test.monitor
          xvfb-run --auto-servernum npm run test:browser

      - name: Build and validate Chrome Web Store package
        working-directory: Glosify.LiveSubtitles.Extension
        run: |
          npm run package:store
          sha256sum artifacts/package/glosify-live-subtitles-0.5.1-beta.zip > "${{ runner.temp }}/extension-package.sha256"
          npm run package:store
          sha256sum --check "${{ runner.temp }}/extension-package.sha256"

      - name: Test assistant state modules
        run: npm test --prefix Glosify.ClientTests

      - name: Publish web application
        run: dotnet publish Glosify/Glosify.csproj --configuration Release --no-build --output "${{ runner.temp }}/myapp"

      - name: Install Playwright Chromium
        run: pwsh Glosify.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser journeys
        env:
          REQUIRE_BROWSER_TESTS: "true"
          GLOSIFY_BROWSER_BASE_URL: http://localhost:5099
          GLOSIFY_BROWSER_RUN_TOKEN: glosify-ci-${{ github.run_id }}-${{ github.run_attempt }}
          GLOSIFY_BROWSER_TRACE_DIRECTORY: ${{ runner.temp }}/playwright-traces/application
          GLOSIFY_BROWSER_RESULTS_DIRECTORY: ${{ runner.temp }}/test-results/browser
          GLOSIFY_BROWSER_APP_LOG: ${{ runner.temp }}/glosify-browser.log
          OPENAI_SECRET_KEY: browser-testing-placeholder
          Legal__ControllerName: Browser Test Operator
          Legal__ContactEmail: browser-tests@example.invalid
        run: bash scripts/run-browser-tests.sh "${{ runner.temp }}/myapp"

      - name: Stamp deployment artifact
        run: printf '%s\n' "$GITHUB_SHA" > "${{ runner.temp }}/myapp/deployment-commit.txt"

      - name: Build EF migration bundle
        run: >-
          dotnet ef migrations bundle
          --project Glosify/Glosify.csproj
          --configuration Release
          --no-build
          --target-runtime linux-x64
          --output "${{ runner.temp }}/migration/efbundle"

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-web
          path: ${{ runner.temp }}/myapp

      - name: Upload migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-migration
          path: ${{ runner.temp }}/migration/efbundle

      - name: Upload Chrome Web Store artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-live-subtitles-0.5.1-beta
          path: Glosify.LiveSubtitles.Extension/artifacts/package/glosify-live-subtitles-0.5.1-beta.zip

      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-failure-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/test-results
            ${{ runner.temp }}/playwright-traces
            ${{ runner.temp }}/glosify-browser.log
            Glosify.LiveSubtitles.Extension/test-results

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: glosify-web
          path: app

      - name: Download migration artifact
        uses: actions/download-artifact@v8
        with:
          name: glosify-migration
          path: migration

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_059CC241545944E3BB4D754796025F63 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_210765179BDB40158ADE7F23514669FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE07FD7E4DAF4E32BF67F3AFE307E71F }}

      - name: Require direct OpenAI App Service key
        shell: bash
        run: |
          openai_key="$(az webapp config appsettings list \
            --name glosify-app \
            --resource-group glosify \
            --query "[?name=='OPENAI_SECRET_KEY'].value | [0]" \
            --output tsv)"
          if [[ -z "$openai_key" ]]; then
            echo "::error::App Service setting OPENAI_SECRET_KEY is missing or empty."
            exit 1
          fi
          unset openai_key

      - name: Read retirement compatibility state
        id: retirement-compatibility
        shell: bash
        run: |
          prepared="$(az webapp config appsettings list \
            --name glosify-app \
            --resource-group glosify \
            --query "[?name=='ClassroomRetirement__Prepared'].value | [0]" \
            --output tsv)"
          if [[ "$prepared" == "true" ]]; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      # Detach only references from retired tables into retained data. Both the
      # previous and replacement artifacts can run on this compatibility schema.
      - name: Prepare schema for artifact replacement
        if: steps.retirement-compatibility.outputs.prepared != 'true'
        env:
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
          ConnectionStrings__DefaultConnection: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
        run: |
          chmod +x migration/efbundle
          migration/efbundle 20260827093000_PrepareClassroomRetirement --connection "$PRODUCTION_SQL_CONNECTION_STRING"

      # This durable marker prevents a later workflow rerun from targeting the
      # compatibility migration after the destructive migration is already applied.
      - name: Record retirement compatibility state
        if: steps.retirement-compatibility.outputs.prepared != 'true'
        run: >-
          az webapp config appsettings set
          --name glosify-app
          --resource-group glosify
          --settings ClassroomRetirement__Prepared=true
          --output none

      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: glosify-app
          slot-name: Production
          package: app

      - name: Verify replacement artifact readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            deployed_commit="$(curl --fail --silent https://glosify-app.azurewebsites.net/deployment-version || true)"
            if [[ "$deployed_commit" == "$GITHUB_SHA" ]] \
              && curl --fail --silent https://glosify-app.azurewebsites.net/readyz > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          deployed_commit="$(curl --fail --silent https://glosify-app.azurewebsites.net/deployment-version || true)"
          if [[ "$deployed_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Expected deployment $GITHUB_SHA but the production worker reported ${deployed_commit:-no version}."
            exit 1
          fi
          curl --fail https://glosify-app.azurewebsites.net/readyz

      # Apply destructive retirement migrations, including CustomQuizzes removal,
      # only after the replacement artifact is ready on the compatibility schema.
      # Authenticated retired-route 404s are
      # covered by the integration suite; anonymous production probes are challenged
      # by the fallback authorization policy and cannot prove absence.
      - name: Apply reviewed database migrations
        env:
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
          ConnectionStrings__DefaultConnection: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
        run: |
          chmod +x migration/efbundle
          migration/efbundle --connection "$PRODUCTION_SQL_CONNECTION_STRING"

      - name: Record retirement migration completion
        run: >-
          az webapp config appsettings set
          --name glosify-app
          --resource-group glosify
          --settings ClassroomRetirement__Complete=true
          --output none

      - name: Verify health after database migration
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent https://glosify-app.azurewebsites.net/readyz > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          curl --fail https://glosify-app.azurewebsites.net/readyz

      # Remove these only after the replacement artifact is healthy. The prior
      # production artifact still needs its retired feature settings during rollout.
      - name: Remove retired AI and feature App Service settings
        run: >-
          az webapp config appsettings delete
          --name glosify-app
          --resource-group glosify
          --setting-names
          GEMINI_API_KEY
          GenerativeAi__Foundry__GatewayApiKey
          GenerativeAi__Foundry__ProjectEndpoint
          RealtimeTranslation__Deployment
          RealtimeTranslation__FoundryEndpoint
          RealtimeTranslation__Model
          RealtimeTranslation__SourceTranscriptionDelay
          RealtimeTranslation__SourceTranscriptionDeployment
          Acs__ConnectionString
          Acs__Endpoint
          AiUsage__SpeakingOutputTokenReserve
          CreditPricing__TokenFeatures__speaking
          Speaking__GenericTutorEnabled
          Speaking__InteractiveBartenderEnabled
          Speaking__MaxSessionsPerUser
          Speaking__SessionTtlMinutes
          Speaking__Agents__Andriy__Version
          Speaking__Agents__Bartender__Name
          Speaking__Agents__Bartender__Version
          Speaking__Agents__FrauSchneider__Version
          Speaking__Agents__Hanna__Version
          Speaking__Agents__Jonas__Version
          Speaking__Agents__Karl__Version
          Speaking__Agents__Kasia__Name
          Speaking__Agents__Kasia__Version
          Speaking__Agents__Liis__Version
          Speaking__Agents__Maarja__Version
          Speaking__Agents__Mietek__Name
          Speaking__Agents__Mietek__Version
          Speaking__Agents__Oksana__Version
          Speaking__Agents__PanMykola__Version
          Speaking__ModelDeployment
          Speaking__ProjectEndpoint
          CreditPricing__Models__0__Deployment
          CreditPricing__Models__0__Multiplier
          CreditPricing__Models__1__Deployment
          CreditPricing__Models__1__Multiplier
          CreditPricing__Models__2__Deployment
          CreditPricing__Models__2__Multiplier
          --output none

      - name: Verify health after settings cleanup
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent https://glosify-app.azurewebsites.net/readyz > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          curl --fail https://glosify-app.azurewebsites.net/readyz
