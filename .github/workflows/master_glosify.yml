name: Build, migrate, and deploy Glosify

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Glosify_CI_Only_1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Glosify_CI_Only_1!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=glosify-ci;User Id=sa;Password=Glosify_CI_Only_1!;Encrypt=True;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Glosify.slnx

      - name: Audit NuGet packages
        run: >-
          dotnet restore Glosify.slnx
          --force-evaluate
          -p:WarningsNotAsErrors=

      - name: Build
        run: dotnet build Glosify.slnx --configuration Release --no-restore

      - name: Verify database migrations from empty SQL Server
        run: |
          dotnet ef database update --project Glosify/Glosify.csproj --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project Glosify/Glosify.csproj --configuration Release --no-build

      - name: Test
        run: dotnet test Glosify.Tests/Glosify.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test browser extension JavaScript
        run: npm test --prefix Glosify.LiveSubtitles.Extension

      - name: Install extension browser-test dependencies
        run: npm ci --prefix Glosify.LiveSubtitles.Extension

      - name: Lint JavaScript
        run: npm run lint --prefix Glosify.LiveSubtitles.Extension

      - name: Audit extension dependencies
        run: npm audit --prefix Glosify.LiveSubtitles.Extension

      - name: Install extension Playwright Chromium
        working-directory: Glosify.LiveSubtitles.Extension
        run: npx playwright install --with-deps chromium

      - name: Test MV3 extension in persistent Chromium
        working-directory: Glosify.LiveSubtitles.Extension
        run: xvfb-run --auto-servernum npm run test:browser

      - name: Build and validate Chrome Web Store package
        working-directory: Glosify.LiveSubtitles.Extension
        run: npm run package:store

      - name: Test assistant state modules
        run: npm test --prefix Glosify.ClientTests

      - name: Install Playwright Chromium
        run: pwsh Glosify.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser journeys
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5099
          GLOSIFY_BROWSER_BASE_URL: http://localhost:5099
        run: |
          dotnet run --project Glosify/Glosify.csproj --configuration Release --no-build --no-launch-profile > "${{ runner.temp }}/glosify-browser.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5099/healthz > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "${{ runner.temp }}/glosify-browser.log"
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail http://localhost:5099/healthz; then
            cat "${{ runner.temp }}/glosify-browser.log"
            exit 1
          fi
          dotnet test Glosify.BrowserTests/Glosify.BrowserTests.csproj --configuration Release --no-build --no-restore

      - name: Publish web application
        run: dotnet publish Glosify/Glosify.csproj --configuration Release --no-build --output "${{ runner.temp }}/myapp"

      - name: Build EF migration bundle
        run: >-
          dotnet ef migrations bundle
          --project Glosify/Glosify.csproj
          --configuration Release
          --no-build
          --target-runtime linux-x64
          --output "${{ runner.temp }}/migration/efbundle"

      - name: Upload web artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-web
          path: ${{ runner.temp }}/myapp

      - name: Upload migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-migration
          path: ${{ runner.temp }}/migration/efbundle

      - name: Upload Chrome Web Store artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glosify-live-subtitles-0.5.0-beta
          path: Glosify.LiveSubtitles.Extension/artifacts/package/glosify-live-subtitles-0.5.0-beta.zip

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: glosify-web
          path: app

      - name: Download migration artifact
        uses: actions/download-artifact@v8
        with:
          name: glosify-migration
          path: migration

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_059CC241545944E3BB4D754796025F63 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_210765179BDB40158ADE7F23514669FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE07FD7E4DAF4E32BF67F3AFE307E71F }}

      - name: Require direct OpenAI App Service key
        shell: bash
        run: |
          openai_key="$(az webapp config appsettings list \
            --name glosify-app \
            --resource-group glosify \
            --query "[?name=='OPENAI_SECRET_KEY'].value | [0]" \
            --output tsv)"
          if [[ -z "$openai_key" ]]; then
            echo "::error::App Service setting OPENAI_SECRET_KEY is missing or empty."
            exit 1
          fi
          unset openai_key

      - name: Apply reviewed database migrations
        env:
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
          ConnectionStrings__DefaultConnection: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
        run: |
          chmod +x migration/efbundle
          migration/efbundle --connection "$PRODUCTION_SQL_CONNECTION_STRING"

      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: glosify-app
          slot-name: Production
          package: app

      # Remove these only after the direct-OpenAI artifact is deployed. The prior
      # production artifact still needs its Foundry settings during the rollout.
      - name: Remove retired AI App Service settings
        run: >-
          az webapp config appsettings delete
          --name glosify-app
          --resource-group glosify
          --setting-names
          GEMINI_API_KEY
          GenerativeAi__Foundry__GatewayApiKey
          GenerativeAi__Foundry__ProjectEndpoint
          RealtimeTranslation__Deployment
          RealtimeTranslation__FoundryEndpoint
          RealtimeTranslation__Model
          RealtimeTranslation__SourceTranscriptionDelay
          RealtimeTranslation__SourceTranscriptionDeployment
          Speaking__Agents__Andriy__Version
          Speaking__Agents__Bartender__Name
          Speaking__Agents__Bartender__Version
          Speaking__Agents__FrauSchneider__Version
          Speaking__Agents__Hanna__Version
          Speaking__Agents__Jonas__Version
          Speaking__Agents__Karl__Version
          Speaking__Agents__Kasia__Name
          Speaking__Agents__Kasia__Version
          Speaking__Agents__Liis__Version
          Speaking__Agents__Maarja__Version
          Speaking__Agents__Mietek__Name
          Speaking__Agents__Mietek__Version
          Speaking__Agents__Oksana__Version
          Speaking__Agents__PanMykola__Version
          Speaking__ModelDeployment
          Speaking__ProjectEndpoint
          CreditPricing__Models__0__Deployment
          CreditPricing__Models__0__Multiplier
          CreditPricing__Models__1__Deployment
          CreditPricing__Models__1__Multiplier
          CreditPricing__Models__2__Deployment
          CreditPricing__Models__2__Multiplier
          --output none
