name: Build, migrate, and deploy Glosify

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Glosify_CI_Only_1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Glosify_CI_Only_1!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=glosify-ci;User Id=sa;Password=Glosify_CI_Only_1!;Encrypt=True;TrustServerCertificate=True

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore Glosify.slnx

      - name: Build
        run: dotnet build Glosify.slnx --configuration Release --no-restore

      - name: Verify database migrations from empty SQL Server
        run: |
          dotnet ef database update --project Glosify/Glosify.csproj --configuration Release --no-build
          dotnet ef migrations has-pending-model-changes --project Glosify/Glosify.csproj --configuration Release --no-build

      - name: Test
        run: dotnet test Glosify.Tests/Glosify.Tests.csproj --configuration Release --no-build --no-restore

      - name: Test browser extension JavaScript
        run: npm test --prefix Glosify.LiveSubtitles.Extension

      - name: Test assistant state modules
        run: npm test --prefix Glosify.ClientTests

      - name: Install Playwright Chromium
        run: pwsh Glosify.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser journeys
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5099
          GLOSIFY_BROWSER_BASE_URL: http://localhost:5099
        run: |
          dotnet run --project Glosify/Glosify.csproj --configuration Release --no-build --no-launch-profile > "${{ runner.temp }}/glosify-browser.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5099/healthz > /dev/null; then
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "${{ runner.temp }}/glosify-browser.log"
              exit 1
            fi
            sleep 2
          done
          if ! curl --fail http://localhost:5099/healthz; then
            cat "${{ runner.temp }}/glosify-browser.log"
            exit 1
          fi
          dotnet test Glosify.BrowserTests/Glosify.BrowserTests.csproj --configuration Release --no-build --no-restore

      - name: Publish web application
        run: dotnet publish Glosify/Glosify.csproj --configuration Release --no-build --output "${{ runner.temp }}/myapp"

      - name: Build EF migration bundle
        run: >-
          dotnet ef migrations bundle
          --project Glosify/Glosify.csproj
          --configuration Release
          --no-build
          --target-runtime linux-x64
          --output "${{ runner.temp }}/migration/efbundle"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: glosify-web
          path: ${{ runner.temp }}/myapp

      - name: Upload migration artifact
        uses: actions/upload-artifact@v4
        with:
          name: glosify-migration
          path: ${{ runner.temp }}/migration/efbundle

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: glosify-web
          path: app

      - name: Download migration artifact
        uses: actions/download-artifact@v4
        with:
          name: glosify-migration
          path: migration

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_059CC241545944E3BB4D754796025F63 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_210765179BDB40158ADE7F23514669FF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EE07FD7E4DAF4E32BF67F3AFE307E71F }}

      - name: Apply reviewed database migrations
        env:
          PRODUCTION_SQL_CONNECTION_STRING: ${{ secrets.PRODUCTION_SQL_CONNECTION_STRING }}
        run: |
          chmod +x migration/efbundle
          migration/efbundle --connection "$PRODUCTION_SQL_CONNECTION_STRING"

      - name: Deploy Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: glosify-app
          slot-name: Production
          package: app
